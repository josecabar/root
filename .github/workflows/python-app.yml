name: Build Windows 64-bit EXE

on:
  push:
    branches: [ starshot ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      with:
        ref: starshot

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller opencv-python numpy matplotlib Pillow scipy
        
    - name: List files (debug)
      run: |
        dir
        ls -la starshot.py
        
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name=starshot "starshot.py"

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: StarShot Windows EXE (Build ${{ github.run_number }})
        body: "Windows 64-bit executable for StarShot"
        draft: false
        prerelease: false
