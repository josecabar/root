name: Build Profiler Analyzer

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: windows-latest

    steps:

    - uses: actions/checkout@v4

    - name: Set up Python 3.12 (64-bit)
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        architecture: "x64"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name=ProfilerAnalyzer FFF_Analysis.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProfilerAnalyzer-Win64
        path: dist/ProfilerAnalyzer.exe
        retention-days: 90
