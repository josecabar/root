name: Build Windows 64-bit EXE

on:
  push:
    branches: [ starshot ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      with:
        ref: starshot

    - name: Set up Python 3.11 (64-bit)
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name=starshot starshot.py

    - name: Install UPX
      run: |
        choco install upx -y

    - name: Compress EXE with UPX
      run: |
        upx -9 --force dist\starshot.exe -o starshot.exe

    - name: Upload EXE to repository
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git add starshot.exe
        git commit -m "Add compiled starshot.exe [skip ci]" || true
        git push || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: starshot-exe
        path: starshot.exe
        retention-days: 90
