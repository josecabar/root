name: Build HWL Renamer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-HWL.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name HWL_Renamer HWL_Renamer.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HWL_Renamer
          path: dist/HWL_Renamer.exe
