name: Build gatingSGRT.exe

on:
  push:
    branches: [ starshot ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      with:
        ref: starshot

    - name: Set up Python 3.11 (64-bit)
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements-gating.txt
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name=gatingSGRT "gating SGRT.v2.py"
    - name: Upload EXE to repository
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        copy dist\starshot.exe starshot.exe
        git add starshot.exe
        git commit -m "Add compiled gatingSGRT.exe [skip ci]" || true
        git push || true
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gatingSGRT-exe
        path: dist/gatingSGRT.exe
        retention-days: 90
